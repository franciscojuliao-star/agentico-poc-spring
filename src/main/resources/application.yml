spring:
  application:
    name: poc-llm-ufc

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/poc_llm_ufc}
    username: ${DB_USERNAME:poc_user}
    password: ${DB_PASSWORD:poc123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:seu-email@gmail.com}
    password: ${MAIL_PASSWORD:sua-senha-de-app-gmail}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    openai:
      api-key: ${GOOGLE_AI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: gemini-2.0-flash

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:chave-secreta-local-dev-minimo-32-caracteres}
    access-token-expiration: 3600000      # 1 hora em ms
    refresh-token-expiration: 604800000   # 7 dias em ms

upload:
  directory: ${UPLOAD_DIR:uploads}

logging:
  level:
    br.ufc.llm: DEBUG
    org.springframework.security: INFO