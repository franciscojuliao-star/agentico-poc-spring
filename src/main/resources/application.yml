spring:
  application:
    name: poc-llm-ufc

  datasource:
    url: jdbc:postgresql://localhost:5432/poc_llm_ufc
    username: poc_user
    password: poc123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:seu-email@gmail.com}
    password: ${MAIL_PASSWORD:sua-senha-de-app}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      chat:
        options:
          model: gpt-4o

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:c2VjcmV0LWtleS1wb2MtbGxtLXVmYy1zdXBlci1zZWN1cmUtMjAyNA==}
    access-token-expiration: 900000       # 15 minutos em ms
    refresh-token-expiration: 604800000   # 7 dias em ms

upload:
  directory: ${UPLOAD_DIR:uploads}

logging:
  level:
    br.ufc.llm: DEBUG
    org.springframework.security: INFO
