services:
  postgres:
    image: postgres:16-alpine
    container_name: poc_llm_ufc_db
    environment:
      POSTGRES_DB: poc_llm_ufc
      POSTGRES_USER: poc_user
      POSTGRES_PASSWORD: poc123
    ports:
      - "5432:5432"
    volumes:
      - poc_llm_ufc_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  poc_llm_ufc_data:
